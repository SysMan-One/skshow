#++
#   FACILITY:	SKSHOW - a nano-utility to show TCP/IP socket counters: the signed release kits (amd64, arm64)
#
#   AUTHOR:	StarLet Squad and Ruslan R. Laishev (AKA: BadAss SysMan)
#
#   CREATION DATE: 12-NOV-2026
#
#	A push of the tag that is __IDENT__ of skshow.c builds the product, runs its smoke tests
#	(ctest) on both architectures, installs the .deb on Debian 12, Debian 13 and Ubuntu 24.04,
#	and attaches the packages, the sources tarball, SHA256SUMS and its minisign signature to
#	the Release of that tag.  The manual run (Actions -> release -> Run workflow) with the
#	<tag> input does the same for an existing tag (the files of its Release are replaced);
#	without it - only builds and tests the branch, see the run's artifacts.
#
#	The tag is __IDENT__ as skshow.c has it, with no "v", in either form:
#	    X.aa-bb[ECOcc]	the form from 12-NOV-2026, two digits in every field (X.03-01ECO02)
#	    X-aa-bb[ECOc]	the older form, kept by a module not touched since (X-03-00)
#	The ident is never given on the command line here, so a tag cannot name a kit the tree
#	is not.
#
#	Built on Debian 12 (bookworm): the image needs glibc of bookworm or newer.  StarLet and
#	HELP are the pinned commits of ci.yml (STARLET_REF, VHELP_REF), both static archives,
#	so the package depends on the C library only.  The package is made for the prefix /usr.
#
#	MODIFICATION HISTORY:
#
#	12-NOV-2026	CLD	X-03-00 : Initial version, after vHELP's release.yml and the
#				deb and install jobs of utility_routines' release.yml.
#
#	12-NOV-2026	CLD	STARLET_REF fde1672 = StarLet 1.7.3 (was 7e910f8, 1.7.2), with ci.yml.
#--

name: release

on:
  push:
    tags: ['X.*', 'X-*', 'V.*', 'V-*']
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing tag (X-03-00, X.03-01ECO02), equal to __IDENT__ of skshow.c of its tree, to build and release; empty - build only"
        required: false
        default: ""

permissions:
  contents: write

env:
  #	The pinned commits of StarLet and HELP - the same as ci.yml, moved by hand, after a check
  STARLET_REF: "fde1672f770155df542b8b909fa3b9470f642044"     # StarLet 1.7.3
  VHELP_REF: "9f89cd6277a4d785978aa8e9202d4782e7dce5e5"     # HELP X.01-38ECO01
  DEPS_PREFIX: "/opt/skshow-deps"

jobs:
  deb:
    name: build ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container:
      image: debian:bookworm
    env:
      DEB_ARCH: ${{ matrix.arch }}
    steps:
      - name: Install prerequisites
        run: |
          apt-get update
          apt-get install --yes --no-install-recommends build-essential cmake dpkg-dev file git curl ca-certificates

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}

      # StarLet first: HELP is built against the installed StarLet
      - name: StarLet and HELP from GitHub
        run: |
          set -e
          mkdir -p /tmp/deps
          for l_pair in "utility_routines:${STARLET_REF}" "vHELP:${VHELP_REF}"
          do
            l_repo="${l_pair%%:*}" l_ref="${l_pair#*:}"
            curl -sSfL --retry 3 -o "/tmp/deps/${l_repo}.tar.gz" \
              "https://github.com/SysMan-One/${l_repo}/archive/${l_ref}.tar.gz"
            mkdir -p "/tmp/deps/${l_repo}"
            tar -xzf "/tmp/deps/${l_repo}.tar.gz" -C "/tmp/deps/${l_repo}" --strip-components=1
            cmake -S "/tmp/deps/${l_repo}" -B "/tmp/deps/${l_repo}-build" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="${DEPS_PREFIX}" \
              -DCMAKE_PREFIX_PATH="${DEPS_PREFIX}" \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DBUILD_TESTING=OFF \
              -DHELP_TESTS=OFF -DHELP_BUILD_SYSCACHE=OFF -DHELP_ALIAS=OFF
            cmake --build "/tmp/deps/${l_repo}-build" -j "$(nproc)"
            cmake --install "/tmp/deps/${l_repo}-build"
          done

      - name: Build, test, package
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_PREFIX_PATH="${DEPS_PREFIX}"
          cmake --build build -j "$(nproc)"
          export PATH="${DEPS_PREFIX}/bin:${PATH}"
          ctest --test-dir build --output-on-failure || {
            rc=$?
            # an annotation is visible without signing in: the names of the failed tests
            for t in $(sed 's/^[0-9]*://' build/Testing/Temporary/LastTestsFailed.log); do echo "::error::ctest FAILED: $t"; done
            exit $rc
          }
          (cd build && cpack -G DEB)

      - name: Check the package
        run: |
          deb=$(ls build/*.deb)
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"
          case "$deb" in build/skshow_*_"${DEB_ARCH}".deb) ;; *) echo "::error::wrong name: $deb"; exit 1;; esac
          dpkg-deb --contents "$deb" | grep -q '/usr/bin/skshow$'
          dpkg-deb --contents "$deb" | grep -q '/usr/share/help/skshow\.hlb$'
          dpkg-deb --contents "$deb" | grep -q '/usr/share/help/ru/skshow_ru\.hlb$'
          dpkg-deb --contents "$deb" | grep -q '/usr/share/man/man8/skshow\.8$'

      - uses: actions/upload-artifact@v6
        with:
          name: deb-${{ matrix.arch }}
          path: build/*.deb
          if-no-files-found: error

  test:
    name: install ${{ matrix.arch }} on ${{ matrix.distro }}
    needs: deb
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
        distro: ['debian:bookworm', 'debian:trixie', 'ubuntu:noble']
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.distro }}
    env:
      DEBIAN_FRONTEND: noninteractive
      LC_ALL: C
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: deb-${{ matrix.arch }}

      - name: Install the package
        run: |
          apt-get update
          apt-get install --yes ./*.deb
          test -x /usr/bin/skshow
          test -f /usr/share/help/skshow.hlb
          test -f /usr/share/help/ru/skshow_ru.hlb

      # In a container SHOW may warn NOPRIV about the processes it cannot see; it exits 0 all the same
      - name: Run it, remove it
        run: |
          out=$(skshow help)
          echo "$out" | head -n 8
          echo "$out" | grep -q 'SKSHOW'
          out=$(skshow show /nocounters)
          echo "$out" | tail -n 4
          echo "$out" | grep -q 'record(s) displayed'
          dpkg --purge skshow
          # (a '!' in front would not stop the step: errexit ignores it)
          if dpkg -s skshow > /dev/null 2>&1; then echo "::error::skshow still known to dpkg after the purge"; exit 1; fi
          for f in /usr/bin/skshow /usr/share/help/skshow.hlb /usr/share/help/ru/skshow_ru.hlb /usr/share/man/man8/skshow.8
          do
            if [ -e "$f" ]; then echo "::error::$f left after the purge"; exit 1; fi
          done

  release:
    name: GitHub Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
          path: src

      - uses: actions/download-artifact@v7
        with:
          pattern: 'deb-*'
          merge-multiple: true

      - name: Make the files of the Release
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # The tag: X.aa-bb[ECOcc] strictly, or the older X-aa-bb[ECOc]; never a "v"
          if ! printf '%s\n' "$TAG" | grep -Eqx '[A-Za-z]\.[0-9]{2}-[0-9]{2}(ECO[0-9]{2})?|[A-Za-z]-[0-9]+-[0-9]+(ECO[0-9]+)?'
          then
            echo "::error::the tag $TAG is of neither form X.aa-bb[ECOcc] nor X-aa-bb[ECOc]"; exit 1
          fi
          ident=$(sed -n 's/^#define[[:space:]][[:space:]]*__IDENT__[[:space:]][[:space:]]*"\([^"]*\)".*/\1/p' src/skshow.c)
          test -n "$ident" || { echo "::error::no __IDENT__ in skshow.c"; exit 1; }
          test "$TAG" = "$ident" || { echo "::error::the tag $TAG is not __IDENT__ $ident of skshow.c"; exit 1; }
          ls *.deb
          test "$(ls skshow_*.deb | wc -l)" = 2 || { echo "::error::not the two packages"; ls *.deb; exit 1; }
          # The sources: the tree of the tag as git has it, nothing built in it
          git -C src archive --format=tar.gz --prefix="skshow-$ident/" -o "$PWD/skshow-$ident.tar.gz" HEAD
          tar tzf "skshow-$ident.tar.gz" | grep -qx "skshow-$ident/skshow.c"
          ls -l *.deb *.tar.gz
          sha256sum *.deb *.tar.gz > SHA256SUMS
          cat SHA256SUMS
          echo "ident=$ident" >> "$GITHUB_ENV"

      #	The secret MINISIGN_KEY is the secret key of minisign.pub, whole text
      #	(no password); it lives in the runner's temporary directory for this
      #	step only.  The signature is checked with the public key pinned below
      #	(the one of minisign.pub) before anything is published.
      - name: Sign SHA256SUMS
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [ -z "${MINISIGN_KEY}" ]
          then
            echo "::error::no MINISIGN_KEY secret - the release would go out unsigned"
            exit 1
          fi
          sudo apt-get update -q && sudo apt-get install -y -q minisign
          key="${RUNNER_TEMP}/minisign.key"
          trap 'rm -f "${key}"' EXIT
          ( umask 077; printf '%s\n' "${MINISIGN_KEY}" > "${key}" )
          minisign -S -s "${key}" -m SHA256SUMS \
            -t "SKSHOW ${TAG} SHA256SUMS signed $(date -u +%d-%b-%Y | tr a-z A-Z)"
          # The key is pinned here, not read from src/: a re-run of an older tag may have no minisign.pub.
          minisign -Vm SHA256SUMS -P RWQl4NAqFsHKkNoHkS52WSZSk+2kb+e58DWYpoi/jVFa6TqOTAm3Ph14

      - name: Attach the files to the Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" *.deb *.tar.gz SHA256SUMS SHA256SUMS.minisig --clobber
          else
            gh release create "$TAG" *.deb *.tar.gz SHA256SUMS SHA256SUMS.minisig --title "SKSHOW $ident" --notes-file - <<EOF
          SKSHOW $ident - a nano-utility that shows the TCP/IP sockets of the system with their byte and packet counters. The .deb for amd64 and arm64 is installed on Debian 12, Debian 13 and Ubuntu 24.04: \`sudo apt install ./skshow_<version>_<arch>.deb\`; the files are in /usr. The sources: \`skshow-$ident.tar.gz\`.

          To check a download: \`minisign -Vm SHA256SUMS -P RWQl4NAqFsHKkNoHkS52WSZSk+2kb+e58DWYpoi/jVFa6TqOTAm3Ph14\` (\`SHA256SUMS.minisig\` next to it), then \`sha256sum -c --ignore-missing SHA256SUMS\`.
          EOF
          fi
